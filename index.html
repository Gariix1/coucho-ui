<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coucho · Simple V9</title>
<style>
:root{
  --bg:#111828;
  --text:#f1f5f9;
  --text2:#d6e1f0;
  --muted:#b5c3d4;
  --accent:#7dd3fc;
  --accent-strong:#38bdf8;
  --success:#34d399;
  --glass-border:rgba(215,231,255,.22);
  --glass-soft-border:rgba(194,217,248,.14);
  --divider:rgba(194,217,248,.08);
  --glass-surface:rgba(17,24,40,.12);
  --glass-panel:rgba(18,27,43,.18);
  --glass-card:rgba(30,41,64,.24);
  --glass-inset:rgba(16,24,39,.20);
  --glass-control:rgba(32,44,66,.34);
  --glass-command:rgba(21,33,47,.30);
  --glass-pill:rgba(48,65,93,.34);
  --modal:rgba(15,23,42,.82);
  --shadow:0 8px 28px rgba(0,0,0,.18);
  --r-control:8px;
  --r-compact:16px;
  --r-card:18px;
  --r-panel:24px;
  --window-bg-1:#0b1220;
  --window-bg-2:#111828;
  --window-bg-3:#0d1625;
  --glow-a:rgba(56,189,248,.13);
  --glow-b:rgba(37,99,235,.10);
  --glow-c:rgba(125,211,252,.13);
  --glow-d:rgba(51,65,85,.26);
  --root-wash:rgba(17,24,40,.10);
  --logo-bg:rgba(0,0,0,.09);
  --logo-border:rgba(255,255,255,.13);
  --win-fg:#aeb8c8;
  --win-hover:rgba(255,255,255,.05);
  --primary-bg:rgba(14,116,144,.76);
  --primary-hover:rgba(8,145,178,.82);
  --primary-border:rgba(125,211,252,.28);
  --primary-fg:#f8fafc;
  --display-hover:rgba(30,41,64,.34);
  --monitor-border:rgba(215,231,255,.24);
  --monitor-bg-a:rgba(16,24,39,.80);
  --monitor-bg-b:rgba(32,44,66,.66);
  --monitor-stand:#59667c;
  --monitor-primary:rgba(125,211,252,.64);
  --monitor-glow:rgba(125,211,252,.08);
  --selected-border:rgba(125,211,252,.42);
  --selected-bg:rgba(34,211,238,.10);
  --meta-tile-bg:rgba(34,211,238,.11);
  --meta-tile-border:rgba(125,211,252,.16);
  --floating-bg:rgba(15,23,42,.78);
  --scrim:rgba(2,6,23,.40);
  --gamepad-bg:rgba(70,84,105,.45);
  --gamepad-border:rgba(215,231,255,.50);
  --gamepad-button-border:rgba(215,231,255,.40);
  --key-bg:#141c29;
  --key-border:#4e5a72;
  --key-round-bg:#28345d;
  --key-round-border:#5669c2;
  --progress-track:rgba(255,255,255,.08);
  --confirm-count:#efd37f
}

html[data-theme="light"]{
  --bg:#f2f6fc;
  --text:#111827;
  --text2:#2b3e55;
  --muted:#455a70;
  --accent:#2563eb;
  --accent-strong:#1d4ed8;
  --success:#16a34a;
  --glass-border:rgba(76,112,158,.30);
  --glass-soft-border:rgba(110,139,180,.32);
  --divider:rgba(110,139,180,.13);
  --glass-surface:rgba(242,246,252,.10);
  --glass-panel:rgba(248,250,254,.22);
  --glass-card:rgba(255,255,255,.31);
  --glass-inset:rgba(243,247,252,.26);
  --glass-control:rgba(255,255,255,.38);
  --glass-command:rgba(247,250,253,.31);
  --glass-pill:rgba(239,245,252,.35);
  --modal:rgba(248,250,254,.84);
  --shadow:0 8px 28px rgba(46,64,88,.12);
  --window-bg-1:#e8f0fa;
  --window-bg-2:#f2f6fc;
  --window-bg-3:#edf4fb;
  --glow-a:rgba(37,99,235,.10);
  --glow-b:rgba(125,211,252,.16);
  --glow-c:rgba(37,99,235,.08);
  --glow-d:rgba(148,163,184,.17);
  --root-wash:rgba(245,248,252,.10);
  --logo-bg:rgba(255,255,255,.22);
  --logo-border:rgba(76,112,158,.16);
  --win-fg:#455a70;
  --win-hover:rgba(17,24,39,.05);
  --primary-bg:rgba(37,99,235,.88);
  --primary-hover:rgba(29,78,216,.92);
  --primary-border:rgba(37,99,235,.24);
  --primary-fg:#f8fafc;
  --display-hover:rgba(255,255,255,.48);
  --monitor-border:rgba(76,112,158,.40);
  --monitor-bg-a:rgba(255,255,255,.72);
  --monitor-bg-b:rgba(226,235,247,.82);
  --monitor-stand:#7b91ad;
  --monitor-primary:rgba(37,99,235,.62);
  --monitor-glow:rgba(37,99,235,.08);
  --selected-border:rgba(37,99,235,.42);
  --selected-bg:rgba(37,99,235,.09);
  --meta-tile-bg:rgba(37,99,235,.08);
  --meta-tile-border:rgba(37,99,235,.14);
  --floating-bg:rgba(248,250,254,.84);
  --scrim:rgba(15,23,42,.22);
  --gamepad-bg:rgba(232,240,250,.86);
  --gamepad-border:rgba(142,166,195,.72);
  --gamepad-button-border:rgba(112,145,185,.62);
  --key-bg:rgba(232,240,250,.92);
  --key-border:#8ea6c3;
  --key-round-bg:#e8f0fa;
  --key-round-border:#8ea6c3;
  --progress-track:rgba(17,24,39,.08);
  --confirm-count:#92400e
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--text);
  font:14px/1.35 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(900px 640px at 82% -10%,var(--glow-a),transparent 64%),
    radial-gradient(760px 580px at -10% 100%,var(--glow-b),transparent 66%),
    linear-gradient(135deg,var(--window-bg-1) 0%,var(--window-bg-2) 48%,var(--window-bg-3) 100%);
  position:relative
}
body:before{
  content:"";position:fixed;inset:-40px;z-index:-2;
  background:
    radial-gradient(520px 420px at 18% 24%,var(--glow-c),transparent 66%),
    radial-gradient(650px 480px at 88% 72%,var(--glow-d),transparent 70%);
  filter:blur(18px)
}
body:after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:var(--root-wash);
  backdrop-filter:blur(28px) saturate(1.18);
  -webkit-backdrop-filter:blur(28px) saturate(1.18)
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.window{height:100%;display:grid;grid-template-rows:32px 1fr}
.titlebar{display:flex;align-items:center;justify-content:space-between;background:rgba(17,24,40,.10);border-bottom:1px solid var(--divider);backdrop-filter:blur(26px) saturate(1.15);-webkit-backdrop-filter:blur(26px) saturate(1.15)}
.brand{display:flex;align-items:center;gap:8px;padding-left:12px;color:var(--text2);font-size:12px}
.logo{width:18px;height:18px;border-radius:5px;background:var(--logo-bg);border:1px solid var(--logo-border);color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:800}
.win{display:flex;height:100%}.win span{width:46px;display:grid;place-items:center;color:var(--win-fg);font-size:11px}.win span:hover{background:var(--win-hover)}.win span:last-child:hover{background:#c42b1c;color:#fff}
.main{height:100%;overflow:auto}.wrap{max-width:1000px;margin:0 auto;padding:24px 24px 48px}
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.header-left{display:flex;align-items:center;gap:11px}
.header-logo{width:42px;height:42px;border-radius:13px;background:var(--logo-bg);border:1px solid var(--logo-border);color:var(--accent);display:grid;place-items:center;font-size:18px;font-weight:800}
.header h1{margin:0;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:0}.header small{display:block;color:var(--text2);font-size:12px;margin-top:4px}
.btn{min-height:36px;border:1px solid var(--glass-soft-border);background:var(--glass-command);border-radius:var(--r-control);padding:6px 14px}
.btn:hover{background:var(--glass-pill);border-color:var(--glass-border)}.btn:active{background:var(--glass-control);color:var(--text2)}.btn.primary{border-color:var(--primary-border);background:var(--primary-bg);color:var(--primary-fg);font-weight:600;box-shadow:none}.btn.primary:hover{background:var(--primary-hover)}.btn.primary:active{filter:brightness(.94);color:var(--primary-fg)}.btn.icon{width:40px;height:40px;padding:0;font-size:16px}
.hero{border:1px solid var(--glass-border);border-radius:var(--r-panel);background:var(--glass-panel);padding:24px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:14px}.namebox{display:flex;align-items:center;gap:11px}.mode-icon{width:46px;height:46px;border-radius:13px;background:var(--glass-control);border:1px solid var(--glass-soft-border);display:grid;place-items:center;font-size:24px}
.hero h2{margin:0;font-size:18px;font-weight:600}.active-mark{font-size:10px;font-weight:600;color:#a7f3d0;margin-bottom:4px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-right:5px}
.display-main{margin-top:20px;width:100%;min-height:190px;border:1px solid var(--glass-soft-border);border-radius:var(--r-card);background:var(--glass-card);display:grid;place-items:center;padding:16px}
.display-main:hover{background:var(--display-hover);border-color:var(--glass-border)}
.kicker{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:12px}
.displays{display:flex;align-items:flex-end;justify-content:center;gap:9px}
.monitor{position:relative;border:1px solid var(--monitor-border);border-radius:6px;background:linear-gradient(145deg,var(--monitor-bg-a),var(--monitor-bg-b));box-shadow:inset 0 1px rgba(255,255,255,.035)}
.monitor:after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:16px;height:6px;border-left:1px solid var(--monitor-stand);border-right:1px solid var(--monitor-stand)}
.monitor.tv{width:108px;height:62px}.monitor.pc{width:76px;height:48px}.monitor.primary{border-color:var(--monitor-primary);box-shadow:0 0 0 1px var(--monitor-glow),0 0 18px var(--monitor-glow)}
.display-name{font-size:15px;font-weight:600;margin-top:16px}
.recipe-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.meta-action{min-height:64px;border:1px solid var(--glass-soft-border);border-radius:var(--r-compact);background:var(--glass-control);display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.meta-action:hover{background:var(--glass-pill);border-color:var(--glass-border)}.meta-icon{width:36px;height:36px;border-radius:var(--r-control);background:var(--meta-tile-bg);border:1px solid var(--meta-tile-border);color:var(--accent);display:grid;place-items:center;font-size:18px}
.meta-action small{display:block;font-size:10px;font-weight:600;color:var(--text2);margin-bottom:2px}.meta-action b{font-size:12px;font-weight:600}
.section{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section h3{margin:0;font-size:18px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}
.card{border:1px solid var(--glass-soft-border);border-radius:var(--r-card);background:var(--glass-card);padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between}.card-name{display:flex;align-items:center;gap:9px}.card-icon{width:38px;height:38px;border-radius:var(--r-control);background:var(--glass-control);border:1px solid var(--glass-soft-border);display:grid;place-items:center;font-size:19px}.card b{font-size:15px;font-weight:600}
.card-display{width:100%;min-height:102px;border:1px solid var(--glass-soft-border);border-radius:var(--r-compact);background:var(--glass-inset);display:grid;place-items:center;margin:12px 0 8px;padding:16px}
.card-display:hover{background:var(--glass-control);border-color:var(--glass-border)}.card-display .monitor.tv{width:64px;height:37px}.card-display .monitor.pc{width:45px;height:29px}.card-display-name{font-size:12px;color:var(--text2);margin-top:10px}
.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card-meta button{min-height:54px;border:1px solid var(--glass-soft-border);border-radius:var(--r-control);background:var(--glass-control);display:flex;align-items:center;gap:8px;padding:8px 10px;text-align:left}
.card-meta button:hover{background:var(--glass-pill);border-color:var(--glass-border)}.card-meta .mi{font-size:14px}.card-meta small{display:block;color:var(--text2);font-size:10px}.card-meta b{font-size:12px;font-weight:600}
.card-actions{margin-top:12px}.card-actions .btn{width:100%;min-height:36px;font-size:12px;padding:6px 14px}
.app-logo{width:46px;height:46px;border-radius:13px;background:var(--glass-control);border:1px solid var(--glass-soft-border);color:var(--text2);display:grid;place-items:center;font-weight:700}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:25px;padding:0 7px;border:1px solid var(--key-border);border-radius:7px;background:var(--key-bg);font-size:9px;font-weight:700}.key.round{min-width:24px;width:24px;border-radius:50%;background:var(--key-round-bg);border-color:var(--key-round-border)}

/* popovers */
.pop{display:none;position:fixed;z-index:50;border:1px solid var(--glass-border);border-radius:var(--r-compact);background:var(--floating-bg);box-shadow:var(--shadow);padding:12px;min-width:300px;backdrop-filter:blur(24px) saturate(1.14);-webkit-backdrop-filter:blur(24px) saturate(1.14)}
.pop.open{display:block}.pop-title{font-size:12px;font-weight:600;color:var(--text2);margin:2px 4px 10px}
.display-options{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.display-option{min-height:110px;border:1px solid var(--glass-soft-border);border-radius:var(--r-control);background:var(--glass-control);display:grid;place-items:center;padding:8px;text-align:center}
.display-option:hover{background:var(--glass-pill)}.display-option.selected{border-color:var(--selected-border);background:var(--selected-bg)}.display-option b{font-size:9px;margin-top:8px}
.app-options{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.app-option{min-height:82px;border:1px solid var(--glass-soft-border);border-radius:var(--r-control);background:var(--glass-control);display:grid;place-items:center;padding:8px;text-align:center}
.app-option:hover{background:var(--glass-pill)}.app-option.selected{border-color:var(--selected-border);background:var(--selected-bg)}.app-option b{font-size:9px}

/* new */
.sheet-wrap{display:none;position:fixed;inset:32px 0 0 0;z-index:55;background:var(--scrim);backdrop-filter:blur(10px);place-items:center;padding:22px}
.sheet-wrap.open{display:grid}.sheet{width:min(740px,94vw);border:1px solid var(--glass-border);border-radius:var(--r-panel);background:var(--floating-bg);box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(24px) saturate(1.14);-webkit-backdrop-filter:blur(24px) saturate(1.14)}
.sheet-head{padding:22px 24px 18px;border-bottom:1px solid var(--divider);display:flex;align-items:center;justify-content:space-between}.sheet-head h2{margin:0;font-size:28px;font-weight:600}
.new-body{padding:0 24px 20px}.new-display{width:100%;min-height:150px;border:1px solid var(--glass-soft-border);border-radius:var(--r-card);background:var(--glass-card);display:grid;place-items:center;padding:12px}
.new-display:hover{background:var(--display-hover);border-color:var(--glass-border)}.new-kicker{font-size:12px;font-weight:600;color:var(--text2);text-transform:none;letter-spacing:0;margin-bottom:12px}
.new-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.new-app{min-height:90px;border:1px solid var(--glass-soft-border);border-radius:var(--r-compact);background:var(--glass-control);display:grid;place-items:center;padding:9px}
.new-app:hover{background:var(--glass-pill)}.new-app.selected{border-color:var(--selected-border);background:var(--selected-bg)}.new-app b{font-size:9px}
.sheet-foot{padding:16px 24px 20px;border-top:1px solid var(--divider);display:flex;justify-content:flex-end}.sheet-foot .btn{min-width:130px}

/* shortcut */
.capture-wrap{display:none;position:fixed;inset:32px 0 0 0;z-index:60;background:var(--scrim);backdrop-filter:blur(12px);place-items:center}
.capture-wrap.open{display:grid}.capture{width:min(440px,92vw);border:1px solid var(--glass-border);border-radius:var(--r-panel);background:var(--floating-bg);box-shadow:var(--shadow);padding:24px;text-align:center;backdrop-filter:blur(24px) saturate(1.14);-webkit-backdrop-filter:blur(24px) saturate(1.14)}
.capture h3{margin:0;font-size:18px;font-weight:600}.controller{width:210px;height:116px;margin:20px auto 16px;border:1px solid var(--glass-soft-border);border-radius:70px;background:var(--glass-card);position:relative}
.guide{position:absolute;left:50%;top:20px;transform:translateX(-50%);min-width:58px;height:28px;border-radius:999px;background:var(--gamepad-bg);border:1px solid var(--gamepad-border);display:grid;place-items:center;font-size:9px;font-weight:700}
.stick{position:absolute;width:28px;height:28px;border-radius:50%;background:#202838;border:1px solid #465267;top:56px}.stick.left{left:35px}.stick.right{right:38px}
.cbtn{position:absolute;width:30px;height:30px;border-radius:50%;border:1px solid var(--gamepad-button-border);background:var(--gamepad-bg);font-size:10px;font-weight:700}.cbtn.a{right:26px;top:49px}.cbtn.x{right:62px;top:24px}.cbtn.y{right:28px;top:14px}
.capture-result{min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:13px}.capture-actions{display:flex;justify-content:center;gap:8px}

/* test */
.test-wrap{display:none;position:fixed;inset:32px 0 0 0;z-index:70;background:var(--scrim);backdrop-filter:blur(10px);place-items:center}
.test-wrap.open{display:grid}.test{width:min(540px,92vw);border:1px solid var(--glass-border);border-radius:var(--r-card);background:var(--floating-bg);box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(24px) saturate(1.14);-webkit-backdrop-filter:blur(24px) saturate(1.14)}
.test-main{padding:26px;display:grid;place-items:center;text-align:center}.test-flow{display:flex;align-items:center;gap:12px}.test-node{width:78px;height:78px;border:1px solid var(--glass-soft-border);border-radius:var(--r-compact);background:var(--glass-control);display:grid;place-items:center;font-size:24px}.test-arrow{color:var(--accent);font-size:18px}.testing{margin-top:15px;color:var(--muted);font-size:10px}
.progress{height:3px;background:var(--progress-track)}.progress div{height:100%;width:0;background:var(--accent);transition:width .4s}
.confirm{display:none;padding:15px 18px;border-top:1px solid var(--divider);align-items:center;justify-content:space-between;gap:12px}.confirm.show{display:flex}.confirm b{font-size:11px}.confirm small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.count{color:var(--confirm-count)}
.toast{display:none;position:fixed;right:20px;bottom:20px;z-index:90;min-width:230px;border:1px solid var(--glass-border);border-radius:var(--r-compact);background:var(--floating-bg);backdrop-filter:blur(24px) saturate(1.14);-webkit-backdrop-filter:blur(24px) saturate(1.14);box-shadow:var(--shadow);padding:14px 16px}
.toast.show{display:block}.toast b{display:block;font-size:10px}.toast span{display:block;color:var(--muted);font-size:9px;margin-top:2px}
@media(max-width:760px){
  .wrap{padding:18px 16px 40px}.recipe-meta{grid-template-columns:1fr}.new-apps,.app-options{grid-template-columns:repeat(2,1fr)}.display-options{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="brand"><div class="logo">C</div><span>Coucho · Control</span></div>
    <div class="win"><span>—</span><span>□</span><span>✕</span></div>
  </div>

  <main class="main">
    <div class="wrap">
      <div class="header">
        <div class="header-left">
          <div class="header-logo">C</div>
          <div><h1>Coucho</h1><small>2 pantallas · 🎮 conectado</small></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn icon" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">☀</button>
          <button class="btn icon" id="newBtn" title="Nuevo">＋</button>
        </div>
      </div>

      <section class="hero">
        <div class="hero-top">
          <div class="namebox">
            <div class="mode-icon" id="heroIcon">🎮</div>
            <div><div class="active-mark"><span class="dot"></span>ACTIVO</div><h2 id="heroName">Gaming</h2></div>
          </div>
        </div>

        <button class="display-main display-trigger" data-id="active">
          <div>
            <div class="kicker">Pantallas</div>
            <div class="displays" id="heroDisplays"></div>
            <div class="display-name" id="heroDisplayName">TV + Monitor</div>
          </div>
        </button>

        <div class="recipe-meta">
          <button class="meta-action app-trigger" data-id="active">
            <div class="meta-icon">▶</div>
            <div><small>Apps</small><b id="heroApp">Steam</b></div>
          </button>
          <button class="meta-action shortcut-trigger" data-id="active">
            <div class="meta-icon">🎮</div>
            <div><small>Activar con</small><b id="heroShortcut">Guide + A</b></div>
          </button>
        </div>
      </section>

      <div class="section"><h3>Tus modos</h3><button class="btn icon" id="newBtn2" title="Nuevo">＋</button></div>
      <div class="cards" id="cards"></div>
    </div>
  </main>
</div>

<div class="pop" id="displayPop">
  <div class="pop-title">Pantallas</div>
  <div class="display-options">
    <button class="display-option" data-mode="preserve"><div><div style="font-size:26px">↔</div><b>Sin cambios</b></div></button>
    <button class="display-option" data-mode="both"><div><div class="displays"><div class="monitor tv primary" style="width:55px;height:32px"></div><div class="monitor pc" style="width:38px;height:25px"></div></div><b>TV + PC</b></div></button>
    <button class="display-option" data-mode="tv"><div><div class="displays"><div class="monitor tv primary" style="width:60px;height:35px"></div></div><b>TV</b></div></button>
    <button class="display-option" data-mode="monitor"><div><div class="displays"><div class="monitor tv primary" style="width:60px;height:35px"></div></div><b>PC</b></div></button>
  </div>
</div>

<div class="pop" id="appPop">
  <div class="pop-title">Apps</div>
  <div class="app-options">
    <button class="app-option" data-app="Ninguna"><div><div class="app-logo">—</div><b>Ninguna</b></div></button>
    <button class="app-option" data-app="Steam"><div><div class="app-logo">S</div><b>Steam</b></div></button>
    <button class="app-option" data-app="Playnite"><div><div class="app-logo">P</div><b>Playnite</b></div></button>
    <button class="app-option" data-app="Plex"><div><div class="app-logo">P</div><b>Plex</b></div></button>
  </div>
</div>

<div class="sheet-wrap" id="newSheet">
  <div class="sheet">
    <div class="sheet-head"><h2 id="newName">Gaming</h2><button class="btn icon" id="closeNew">✕</button></div>
    <div class="new-body">
      <button class="new-display" id="newDisplay">
        <div>
          <div class="new-kicker">Pantallas</div>
          <div class="displays" id="newDisplays"></div>
          <div class="display-name" id="newDisplayName">TV + Monitor</div>
        </div>
      </button>

      <div class="new-apps" id="newApps">
        <button class="new-app selected" data-app="Steam"><div><div class="app-logo">S</div><b>Steam</b></div></button>
        <button class="new-app" data-app="Playnite"><div><div class="app-logo">P</div><b>Playnite</b></div></button>
        <button class="new-app" data-app="Plex"><div><div class="app-logo">P</div><b>Plex</b></div></button>
        <button class="new-app" data-app="Ninguna"><div><div class="app-logo">—</div><b>Ninguna</b></div></button>
      </div>
    </div>
    <div class="sheet-foot"><button class="btn primary" id="newTry">Probar</button></div>
  </div>
</div>

<div class="capture-wrap" id="shortcutOverlay">
  <div class="capture">
    <h3>Activar con</h3>
    <div class="controller">
      <div class="guide">Guide</div><div class="stick left"></div><div class="stick right"></div>
      <button class="cbtn a" id="capA">A</button>
      <button class="cbtn x" id="capX">X</button>
      <button class="cbtn y" id="capY">Y</button>
    </div>
    <div class="capture-result" id="captureResult"><span style="color:var(--muted)">A · X · Y</span></div>
    <div class="capture-actions">
      <button class="btn" id="capCancel">Cancelar</button>
      <button class="btn" id="capManual">Sin atajo</button>
      <button class="btn primary" id="capUse" style="display:none">Usar</button>
    </div>
  </div>
</div>

<div class="test-wrap" id="testOverlay">
  <div class="test">
    <div class="test-main">
      <div class="test-flow">
        <div class="test-node" id="testDisplay">▣</div>
        <div class="test-arrow">+</div>
        <div class="test-node" id="testApp">S</div>
      </div>
      <div class="testing" id="testText">Probando…</div>
    </div>
    <div class="progress"><div id="progress"></div></div>
    <div class="confirm" id="confirm">
      <div><b>¿Se ve bien?</b><small>Restaurar en <span class="count" id="count">15</span> s</small></div>
      <div style="display:flex;gap:8px"><button class="btn" id="revert">Restaurar</button><button class="btn primary" id="keep">Conservar</button></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><b id="toastTitle"></b><span id="toastText"></span></div>

<script>
(function(){
  var sets=[
    {id:1,name:'Gaming',icon:'🎮',mode:'both',display:'TV + Monitor',app:'Steam',shortcut:'Guide + A',active:true},
    {id:2,name:'Películas',icon:'🎬',mode:'tv',display:'Solo TV',app:'Plex',shortcut:'Manual',active:false},
    {id:3,name:'Escritorio',icon:'🖥️',mode:'monitor',display:'Solo Monitor',app:'Ninguna',shortcut:'Manual',active:false}
  ];

  var editTarget=null;
  var shortcutTarget=null;
  var captured=null;
  var newDraft={mode:'both',display:'TV + Monitor',app:'Steam',name:'Gaming',icon:'🎮'};
  var testContext=null;
  var progressTimer=null;
  var countdownTimer=null;

  var savedTheme=localStorage.getItem('coucho-theme');
  var initialTheme=savedTheme==='light'||savedTheme==='dark'?savedTheme:'dark';
  document.documentElement.dataset.theme=initialTheme;

  function q(s){return document.querySelector(s)}
  function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
  function byId(id){return sets.find(function(x){return x.id===id})}
  function active(){return sets.find(function(x){return x.active})||sets[0]}
  function resolveId(raw){return raw==='active'?active().id:Number(raw)}
  function logo(app){return app==='Ninguna'?'—':app.charAt(0).toUpperCase()}
  function autoMeta(app){
    if(app==='Plex') return {name:'Películas',icon:'🎬'};
    if(app==='Ninguna') return {name:'Escritorio',icon:'🖥️'};
    return {name:'Gaming',icon:'🎮'};
  }
  function modeName(mode){
    if(mode==='preserve') return 'Sin cambios';
    if(mode==='tv') return 'Solo TV';
    if(mode==='monitor') return 'Solo Monitor';
    return 'TV + Monitor';
  }
  function displayMarkup(mode,small){
    if(mode==='preserve') return '<div style="font-size:'+(small?'24':'34')+'px;color:#aab5c6">↔</div>';
    var tv='<div class="monitor tv primary"'+(small?' style="width:55px;height:32px"':'')+'></div>';
    var pc='<div class="monitor pc"'+(small?' style="width:38px;height:25px"':'')+'></div>';
    if(mode==='tv') return tv;
    if(mode==='monitor') return '<div class="monitor tv primary"'+(small?' style="width:55px;height:32px"':' style="width:74px;height:44px"')+'></div>';
    return tv+pc;
  }
  function shortcutLabel(v){return v==='Manual'?'Añadir':v}
  function shortcutMarkup(v){
    if(v==='Manual') return '<span style="color:var(--muted)">Sin atajo</span>';
    var p=v.split(' + ');
    return '<span class="key">'+p[0]+'</span><span>+</span><span class="key round">'+p[1]+'</span>';
  }
  function toast(t,s){
    q('#toastTitle').textContent=t;q('#toastText').textContent=s;q('#toast').classList.add('show');
    clearTimeout(window._toast);window._toast=setTimeout(function(){q('#toast').classList.remove('show')},2100);
  }

  function render(){
    var a=active();
    q('#heroName').textContent=a.name;q('#heroIcon').textContent=a.icon;
    q('#heroDisplays').innerHTML=displayMarkup(a.mode,false);q('#heroDisplayName').textContent=a.display;
    q('#heroApp').textContent=a.app;q('#heroShortcut').textContent=shortcutLabel(a.shortcut);

    q('#cards').innerHTML=sets.filter(function(s){return !s.active}).map(function(s){
      return '<article class="card">'+
        '<div class="card-head"><div class="card-name"><div class="card-icon">'+s.icon+'</div><b>'+s.name+'</b></div></div>'+
        '<button class="card-display display-trigger" data-id="'+s.id+'"><div><div class="displays">'+displayMarkup(s.mode,true)+'</div><div class="card-display-name">'+s.display+'</div></div></button>'+
        '<div class="card-meta">'+
          '<button class="app-trigger" data-id="'+s.id+'"><span class="mi">▶</span><div><small>Apps</small><b>'+s.app+'</b></div></button>'+
          '<button class="shortcut-trigger" data-id="'+s.id+'"><span class="mi">🎮</span><div><small>Activar con</small><b>'+shortcutLabel(s.shortcut)+'</b></div></button>'+
        '</div>'+
        '<div class="card-actions"><button class="btn primary activate" data-id="'+s.id+'">Activar</button></div>'+
      '</article>';
    }).join('');
    bindDynamic();
  }

  function bindDynamic(){
    qa('.display-trigger').forEach(function(b){b.onclick=function(e){openDisplayPop(e.currentTarget,b.dataset.id,false)}});
    qa('.app-trigger').forEach(function(b){b.onclick=function(e){openAppPop(e.currentTarget,b.dataset.id,false)}});
    qa('.shortcut-trigger').forEach(function(b){b.onclick=function(){openShortcut(b.dataset.id)}});
    qa('.activate').forEach(function(b){b.onclick=function(){activate(Number(b.dataset.id))}});
  }

  function activate(id){
    sets.forEach(function(s){s.active=s.id===id});render();toast(byId(id).name,'Activo');
  }

  function positionPop(pop,anchor){
    var r=anchor.getBoundingClientRect();
    var top=Math.min(window.innerHeight-pop.offsetHeight-14,r.bottom+8);
    var left=Math.max(12,Math.min(window.innerWidth-pop.offsetWidth-12,r.left+r.width/2-pop.offsetWidth/2));
    pop.style.top=top+'px';pop.style.left=left+'px';
  }
  function closePops(){q('#displayPop').classList.remove('open');q('#appPop').classList.remove('open')}

  function openDisplayPop(anchor,rawId,isNew){
    closePops();editTarget=isNew?'new':resolveId(rawId);
    var mode=isNew?newDraft.mode:byId(editTarget).mode;
    qa('#displayPop .display-option').forEach(function(x){x.classList.toggle('selected',x.dataset.mode===mode)});
    q('#displayPop').classList.add('open');positionPop(q('#displayPop'),anchor);
  }

  function openAppPop(anchor,rawId,isNew){
    closePops();editTarget=isNew?'new':resolveId(rawId);
    var app=isNew?newDraft.app:byId(editTarget).app;
    qa('#appPop .app-option').forEach(function(x){x.classList.toggle('selected',x.dataset.app===app)});
    q('#appPop').classList.add('open');positionPop(q('#appPop'),anchor);
  }

  qa('#displayPop .display-option').forEach(function(b){
    b.onclick=function(){
      var mode=b.dataset.mode;closePops();
      if(editTarget==='new'){
        newDraft.mode=mode;newDraft.display=modeName(mode);renderNew();return;
      }
      var s=byId(editTarget);
      startTest({kind:'display',id:s.id,mode:mode,display:modeName(mode),app:s.app,name:s.name,icon:s.icon});
    };
  });

  qa('#appPop .app-option').forEach(function(b){
    b.onclick=function(){
      var app=b.dataset.app;closePops();
      if(editTarget==='new'){
        newDraft.app=app;var nm=autoMeta(app);newDraft.name=nm.name;newDraft.icon=nm.icon;renderNew();return;
      }
      var s=byId(editTarget);
      s.app=app;
      render();
      toast('Apps',app);
    };
  });

  function openNew(){
    newDraft={mode:'both',display:'TV + Monitor',app:'Steam',name:'Gaming',icon:'🎮'};
    renderNew();q('#newSheet').classList.add('open');
  }

  function renderNew(){
    q('#newName').textContent=newDraft.name;
    q('#newDisplays').innerHTML=displayMarkup(newDraft.mode,false);
    q('#newDisplayName').textContent=newDraft.display;
    qa('#newApps .new-app').forEach(function(b){b.classList.toggle('selected',b.dataset.app===newDraft.app)});
  }

  function syncThemeButton(){
    var light=document.documentElement.dataset.theme==='light';
    q('#themeBtn').textContent=light?'☾':'☀';
    q('#themeBtn').title=light?'Modo oscuro':'Modo claro';
    q('#themeBtn').setAttribute('aria-label',q('#themeBtn').title);
  }

  q('#themeBtn').onclick=function(){
    var next=document.documentElement.dataset.theme==='light'?'dark':'light';
    document.documentElement.dataset.theme=next;
    localStorage.setItem('coucho-theme',next);
    syncThemeButton();
  };

  q('#newBtn').onclick=q('#newBtn2').onclick=openNew;
  q('#closeNew').onclick=function(){q('#newSheet').classList.remove('open')};
  q('#newDisplay').onclick=function(e){openDisplayPop(e.currentTarget,null,true)};

  qa('#newApps .new-app').forEach(function(b){
    b.onclick=function(){
      newDraft.app=b.dataset.app;
      var m=autoMeta(newDraft.app);newDraft.name=m.name;newDraft.icon=m.icon;
      renderNew();
    };
  });

  q('#newTry').onclick=function(){
    q('#newSheet').classList.remove('open');
    startTest({
      kind:'new',id:Date.now(),mode:newDraft.mode,display:newDraft.display,
      app:newDraft.app,shortcut:'Manual',name:newDraft.name,icon:newDraft.icon
    });
  };

  function openShortcut(rawId){
    shortcutTarget=resolveId(rawId);captured=null;
    q('#captureResult').innerHTML='<span style="color:var(--muted)">A · X · Y</span>';
    q('#capUse').style.display='none';q('#shortcutOverlay').classList.add('open');
  }

  function capture(v){
    captured='Guide + '+v;
    q('#captureResult').innerHTML=shortcutMarkup(captured);
    q('#capUse').style.display='inline-flex';
  }

  q('#capA').onclick=function(){capture('A')};
  q('#capX').onclick=function(){capture('X')};
  q('#capY').onclick=function(){capture('Y')};
  q('#capCancel').onclick=function(){q('#shortcutOverlay').classList.remove('open')};
  q('#capManual').onclick=function(){
    byId(shortcutTarget).shortcut='Manual';
    q('#shortcutOverlay').classList.remove('open');
    render();toast('Activar con','Sin atajo');
  };
  q('#capUse').onclick=function(){
    if(!captured)return;
    byId(shortcutTarget).shortcut=captured;
    q('#shortcutOverlay').classList.remove('open');
    render();toast('Activar con',captured);
  };

  function startTest(ctx){
    testContext=ctx;clearInterval(progressTimer);clearInterval(countdownTimer);
    q('#testDisplay').innerHTML='<div class="displays">'+displayMarkup(ctx.mode,true)+'</div>';
    q('#testApp').textContent=logo(ctx.app);
    q('#testText').textContent='Probando '+ctx.name+'…';
    q('#progress').style.width='0%';q('#confirm').classList.remove('show');q('#testOverlay').classList.add('open');

    var pct=0;
    progressTimer=setInterval(function(){
      pct+=25;q('#progress').style.width=pct+'%';
      if(pct>=100){
        clearInterval(progressTimer);q('#testText').textContent='Listo';q('#confirm').classList.add('show');
        var left=15;q('#count').textContent=left;
        countdownTimer=setInterval(function(){
          left--;q('#count').textContent=left;
          if(left<=0){
            clearInterval(countdownTimer);q('#testOverlay').classList.remove('open');toast('Restaurado','Sin cambios');
          }
        },1000);
      }
    },340);
  }

  q('#keep').onclick=function(){
    clearInterval(countdownTimer);
    if(testContext.kind==='display'){
      var s=byId(testContext.id);s.mode=testContext.mode;s.display=testContext.display;
    }else{
      sets.push({
        id:testContext.id,name:testContext.name,icon:testContext.icon,
        mode:testContext.mode,display:testContext.display,app:testContext.app,
        shortcut:'Manual',active:false
      });
      sets.forEach(function(s){s.active=s.id===testContext.id});
    }
    q('#testOverlay').classList.remove('open');render();toast(testContext.name,'Guardado');
  };

  q('#revert').onclick=function(){
    clearInterval(countdownTimer);q('#testOverlay').classList.remove('open');toast('Restaurado','Sin cambios');
  };

  document.addEventListener('click',function(e){
    if(!e.target.closest('.pop')&&!e.target.closest('.display-trigger')&&!e.target.closest('.app-trigger')&&!e.target.closest('#newDisplay')) closePops();
  });

  syncThemeButton();
  render();
})();
</script>
</body>
</html>
